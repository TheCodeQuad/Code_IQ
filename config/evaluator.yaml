evaluator:
  name: "Documentation Evaluator Module"
  enabled: true

evaluation_framework:
  metrics:
    completeness:
      weight: 0.30
      check:
        - all_functions_documented
        - all_parameters_documented
        - return_types_documented
        - examples_provided
      
    accuracy:
      weight: 0.30
      check:
        - parameter_types_match
        - return_types_match
        - examples_execute
        - no_contradictions
    
    clarity:
      weight: 0.20
      check:
        - readability_score
        - jargon_level
        - sentence_complexity
        - structure_coherence
    
    consistency:
      weight: 0.20
      check:
        - style_uniformity
        - terminology_consistency
        - format_compliance
        - naming_conventions

  scoring:
    scale: 100
    pass_threshold: 70
    excellent_threshold: 90

role_based_evaluation:
  roles:
    developer:
      enabled: true
      focus:
        - technical_accuracy
        - code_examples
        - api_reference
        - implementation_details
      
    technical_writer:
      enabled: true
      focus:
        - clarity
        - structure
        - grammar
        - style_guide_compliance
    
    end_user:
      enabled: true
      focus:
        - simplicity
        - usage_examples
        - getting_started
        - troubleshooting

output_bundle:
  generate:
    - final_source_code
    - role_based_docs
    - evaluation_report
    - summary_readme
  
  final_source_code:
    format: "original_with_docstrings"
    preserve_formatting: true
    include_type_hints: true
    backup_original: true
  
  role_based_docs:
    formats:
      - markdown
      - html
    
    developer:
      include:
        - api_reference
        - code_examples
        - architecture_diagrams
        - dependency_graphs
    
    technical_writer:
      include:
        - style_guide
        - documentation_structure
        - writing_guidelines
    
    end_user:
      include:
        - getting_started
        - tutorials
        - faq
        - troubleshooting
  
  evaluation_report:
    format: "markdown"
    include:
      - overall_score
      - metric_breakdown
      - identified_issues
      - recommendations
      - comparison_charts
  
  summary_readme:
    format: "markdown"
    sections:
      - project_overview
      - installation
      - quick_start
      - documentation_coverage
      - quality_metrics
      - contributing

reports:
  verbosity: "detailed"  # summary, detailed, comprehensive
  include_visualizations: true
  export_formats:
    - markdown
    - html
    - pdf
    - json