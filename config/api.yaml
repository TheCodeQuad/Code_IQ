api:
  # Provider configuration
  provider: "openrouter"
  base_url: "https://openrouter.ai/api/v1/chat/completions"
  
  # Retry configuration
  retry:
    max_attempts: 3
    backoff_factor: 2
    max_backoff: 60
    retry_on_timeout: true
  
  # Timeout settings (seconds)
  timeout:
    connect: 10
    read: 300
    write: 10
  
  # Cost tracking
  cost_tracking:
    enabled: true
    warn_threshold: 10.0
    hard_limit: 100.0
    alert_email: null
  
  # Monitoring
  monitoring:
    enabled: true
    log_requests: true
    log_responses: false
    track_tokens: true
    track_latency: true
  
  # Caching
  cache:
    enabled: true
    ttl: 3600
    strategy: "lru"
    max_size: 1000