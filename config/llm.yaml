agent_models:
  evaluator:
    model: qwen2.5-coder-1.5b-instruct-q4_k_m
    params:
      max_tokens: 4000
      temperature: 0.4
    provider: local
  reader:
    model: qwen2.5-coder-1.5b-instruct-q4_k_m
    params:
      max_tokens: 4000
      temperature: 0.3
    provider: local
  searcher:
    model: qwen2.5-coder-1.5b-instruct-q4_k_m
    params:
      max_tokens: 2000
      temperature: 0.5
    provider: local
  verifier:
    model: qwen2.5-coder-1.5b-instruct-q4_k_m
    params:
      max_tokens: 4000
      temperature: 0.2
    provider: local
  writer:
    model: qwen2.5-coder-1.5b-instruct-q4_k_m
    params:
      max_tokens: 2000
      temperature: 0.3
    provider: local
providers:
  anthropic:
    api_base_url: https://api.anthropic.com
    api_version: '2023-06-01'
    default_params:
      max_tokens: 4000
      temperature: 0.7
    enabled: false
    models:
      default: claude-sonnet-4-20250514
  custom:
    api_base_url: http://localhost:8000
    api_version: v1
    default_params:
      max_tokens: 2000
      temperature: 0.7
    enabled: false
    models:
      default: local-model
  gemini:
    api_base_url: https://generativelanguage.googleapis.com/v1beta/models
    api_key_env: GEMINI_API_KEY
    default_params:
      max_tokens: 4000
      temperature: 0.7
    enabled: false
    models:
      default: gemini-1.5-flash
    timeout: 120
  local:
    api_base_url: http://localhost:11434/v1/chat/completions
    api_key_env: DUMMY
    default_params:
      max_tokens: 2000
      temperature: 0.3
    enabled: true
    main_gpu: 0
    mode: llama_cpp
    model_path: 'C:\PROJECTS\Code_IQ\models\qwen2.5-coder-1.5b-instruct-q4_k_m.gguf'
    models:
      default: qwen2.5-coder-1.5b-instruct-q4_k_m
    n_ctx: 8192
    n_gpu_layers: -1
    n_threads: null
  openai:
    api_base_url: https://api.openai.com/v1
    api_version: v1
    default_params:
      max_tokens: 4000
      temperature: 0.7
    enabled: false
    models:
      default: gpt-4-turbo-preview
  openrouter:
    api_base_url: https://openrouter.ai/api/v1/chat/completions
    api_key_env: OPENROUTER_API_KEY
    default_params:
      max_tokens: 4000
      temperature: 0.7
    enabled: false
    models:
      deepseek-r1t-chimera:
        capabilities:
        - text_generation
        - code_analysis
        - code_generation
        - reasoning
        context_window: 128000
        cost_per_1k_input: 0.0
        cost_per_1k_output: 0.0
        max_output_tokens: 8192
        model_id: tngtech/deepseek-r1t-chimera:free
        name: DeepSeek R1T Chimera Free
      default: tngtech/deepseek-r1t-chimera:free
      gpt-4-turbo:
        capabilities:
        - text_generation
        - code_analysis
        - long_context
        context_window: 128000
        cost_per_1k_input: 0.01
        cost_per_1k_output: 0.03
        max_output_tokens: 4096
        model_id: openai/gpt-4-turbo
        name: GPT-4 Turbo
      gpt-4o:
        capabilities:
        - text_generation
        - code_analysis
        - multimodal
        context_window: 128000
        cost_per_1k_input: 0.005
        cost_per_1k_output: 0.015
        max_output_tokens: 4096
        model_id: openai/gpt-4o
        name: GPT-4O
      gpt-4o-mini:
        capabilities:
        - text_generation
        - code_analysis
        context_window: 128000
        cost_per_1k_input: 0.00015
        cost_per_1k_output: 0.0006
        max_output_tokens: 4096
        model_id: openai/gpt-4o-mini
        name: GPT-4O Mini
    timeout: 120
