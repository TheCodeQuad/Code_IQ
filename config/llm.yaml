# LLM Provider Configurations
providers:
  openrouter:
    enabled: true
    api_base_url: "https://api.openrouter.ai/v1"
    api_key_env: "OPENROUTER_API_KEY"
    timeout: 60

    # Model configurations (model_id should match OpenRouter's model identifiers)
    models:
      default: "gpt-4o-mini"

      gpt-4o-mini:
        name: "gpt-4o-mini"
        model_id: "gpt-4o-mini"
        context_window: 32768
        max_output_tokens: 8192
        cost_per_1k_input: 0.02
        cost_per_1k_output: 0.05
        capabilities:
          - text_generation
          - code_analysis
          - function_calling

      gpt-4o:
        name: "gpt-4o"
        model_id: "gpt-4o"
        context_window: 65536
        max_output_tokens: 16384
        cost_per_1k_input: 0.04
        cost_per_1k_output: 0.10
        capabilities:
          - text_generation
          - code_analysis
          - long_context

      claude-2-proxy:
        name: "claude-2 (via OpenRouter)"
        model_id: "replace-with-openrouter-claude-model-id"
        context_window: 200000
        max_output_tokens: 16384
        cost_per_1k_input: 0.03
        cost_per_1k_output: 0.08
        capabilities:
          - text_generation
          - code_analysis

    default_params:
      temperature: 0.7
      max_tokens: 4000
      top_p: 0.9
      top_k: 40

    rate_limits:
      tier_1:
        requests: 500
        tokens: 200000

  # Existing providers left here as fallbacks (optional)
  anthropic:
    enabled: true
    api_base_url: "https://api.anthropic.com"
    api_version: "2023-06-01"
    models:
      default: "claude-sonnet-4-20250514"
    default_params:
      temperature: 0.7
      max_tokens: 4000

  openai:
    enabled: true
    api_base_url: "https://api.openai.com/v1"
    api_version: "v1"
    models:
      default: "gpt-4-turbo-preview"
    default_params:
      temperature: 0.7
      max_tokens: 4000

  custom:
    enabled: false
    api_base_url: "http://localhost:8000"
    api_version: "v1"
    models:
      default: "local-model"
    default_params:
      temperature: 0.7
      max_tokens: 2000

# Agent-specific LLM assignments — use OpenRouter provider
agent_models:
  reader:
    provider: "openrouter"
    model: "gpt-4o-mini"
    params:
      temperature: 0.3
      max_tokens: 8000

  searcher:
    provider: "openrouter"
    model: "gpt-4o-mini"
    params:
      temperature: 0.5
      max_tokens: 2000

  writer:
    provider: "openrouter"
    model: "gpt-4o"
    params:
      temperature: 0.7
      max_tokens: 4000

  verifier:
    provider: "openrouter"
    model: "gpt-4o-mini"
    params:
      temperature: 0.2
      max_tokens: 4000

  evaluator:
    provider: "openrouter"
    model: "gpt-4o"
    params:
      temperature: 0.4
      max_tokens: 8000