# LLM Provider Configurations
providers:
  openrouter:
    enabled: true
    api_base_url: "https://openrouter.ai/api/v1/chat/completions"
    api_key_env: "OPENROUTER_API_KEY"
    timeout: 120
    models:
      default: "tngtech/deepseek-r1t-chimera:free"
      deepseek-r1t-chimera:
        name: "DeepSeek R1T Chimera Free"
        model_id: "tngtech/deepseek-r1t-chimera:free"
        context_window: 128000
        max_output_tokens: 8192
        cost_per_1k_input: 0.0
        cost_per_1k_output: 0.0
        capabilities:
          - text_generation
          - code_analysis
          - code_generation
          - reasoning
      gpt-4-turbo:
        name: "GPT-4 Turbo"
        model_id: "openai/gpt-4-turbo"
        context_window: 128000
        max_output_tokens: 4096
        cost_per_1k_input: 0.01
        cost_per_1k_output: 0.03
        capabilities:
          - text_generation
          - code_analysis
          - long_context
      gpt-4o:
        name: "GPT-4O"
        model_id: "openai/gpt-4o"
        context_window: 128000
        max_output_tokens: 4096
        cost_per_1k_input: 0.005
        cost_per_1k_output: 0.015
        capabilities:
          - text_generation
          - code_analysis
          - multimodal
      gpt-4o-mini:
        name: "GPT-4O Mini"
        model_id: "openai/gpt-4o-mini"
        context_window: 128000
        max_output_tokens: 4096
        cost_per_1k_input: 0.00015
        cost_per_1k_output: 0.0006
        capabilities:
          - text_generation
          - code_analysis
    default_params:
      temperature: 0.7
      max_tokens: 4000
    rate_limits:
      tier_1:
        requests: 100
        tokens: 1000000

  local:
    enabled: false
    api_base_url: "http://localhost:11434/v1/chat/completions"
    api_key_env: "DUMMY"
    models:
      default: "qwen2.5:7b"
    default_params:
      temperature: 0.7
      max_tokens: 4000
    rate_limits:
      tier_1:
        requests: 500
        tokens: 200000

  gemini:
    enabled: false
    api_base_url: "https://generativelanguage.googleapis.com/v1beta/models"
    api_key_env: "GEMINI_API_KEY"
    timeout: 120
    models:
      default: "gemini-1.5-flash"
    default_params:
      temperature: 0.7
      max_tokens: 4000
    rate_limits:
      tier_1:
        requests: 60
        tokens: 1000000

  anthropic:
    enabled: false
    api_base_url: "https://api.anthropic.com"
    api_version: "2023-06-01"
    models:
      default: "claude-sonnet-4-20250514"
    default_params:
      temperature: 0.7
      max_tokens: 4000

  openai:
    enabled: false
    api_base_url: "https://api.openai.com/v1"
    api_version: "v1"
    models:
      default: "gpt-4-turbo-preview"
    default_params:
      temperature: 0.7
      max_tokens: 4000

  custom:
    enabled: false
    api_base_url: "http://localhost:8000"
    api_version: "v1"
    models:
      default: "local-model"
    default_params:
      temperature: 0.7
      max_tokens: 2000

# Agent-specific LLM assignments — use OpenRouter provider
agent_models:
  reader:
    provider: "openrouter"
    model: "tngtech/deepseek-r1t-chimera:free"
    params:
      temperature: 0.3
      max_tokens: 8000

  searcher:
    provider: "openrouter"
    model: "tngtech/deepseek-r1t-chimera:free"
    params:
      temperature: 0.5
      max_tokens: 2000

  writer:
    provider: "openrouter"
    model: "tngtech/deepseek-r1t-chimera:free"
    params:
      temperature: 0.7
      max_tokens: 4000

  verifier:
    provider: "openrouter"
    model: "tngtech/deepseek-r1t-chimera:free"
    params:
      temperature: 0.2
      max_tokens: 4000

  evaluator:
    provider: "openrouter"
    model: "tngtech/deepseek-r1t-chimera:free"
    params:
      temperature: 0.4
      max_tokens: 8000