# LLM Provider Configurations
providers:
  openrouter:
    enabled: false
    api_base_url: "https://openrouter.ai/api/v1/chat/completions"
    api_key_env: "OPENROUTER_API_KEY"
    timeout: 120
    models:
      default: "openai/gpt-4-turbo"
      gpt-4-turbo:
        name: "GPT-4 Turbo"
        model_id: "openai/gpt-4-turbo"
        context_window: 128000
        max_output_tokens: 4096
        cost_per_1k_input: 0.01
        cost_per_1k_output: 0.03
        capabilities:
          - text_generation
          - code_analysis
          - long_context
      gpt-4o:
        name: "GPT-4O"
        model_id: "openai/gpt-4o"
        context_window: 128000
        max_output_tokens: 4096
        cost_per_1k_input: 0.005
        cost_per_1k_output: 0.015
        capabilities:
          - text_generation
          - code_analysis
          - multimodal
      gpt-4o-mini:
        name: "GPT-4O Mini"
        model_id: "openai/gpt-4o-mini"
        context_window: 128000
        max_output_tokens: 4096
        cost_per_1k_input: 0.00015
        cost_per_1k_output: 0.0006
        capabilities:
          - text_generation
          - code_analysis
    default_params:
      temperature: 0.7
      max_tokens: 4000
    rate_limits:
      tier_1:
        requests: 100
        tokens: 1000000

  local:
    enabled: true
    api_base_url: "http://localhost:11434"
    api_key_env: "DUMMY"
    timeout: 300
    models:
      default: "qwen2.5:7b"
      qwen2.5-7b:
        name: "Qwen 2.5 7B"
        model_id: "qwen2.5:7b"
        context_window: 32768
        max_output_tokens: 8192
        capabilities:
          - text_generation
          - code_analysis
    default_params:
      temperature: 0.7
      max_tokens: 4000
      num_gpu: -1              # ALL layers to GPU (your A2 has 16GB - plenty for 7B model)
      num_ctx: 16384           # Reduced for faster prefill - increase if needed
      num_batch: 512           # Reduced for more consistent GPU utilization
      num_thread: 16           # Adjust to your CPU core count
      num_parallel: 4          # A2 can handle more parallelism
    rate_limits:
      tier_1:
        requests: 1000
        tokens: 500000

  gemini:
    enabled: false
    api_base_url: "https://generativelanguage.googleapis.com/v1beta/models"
    api_key_env: "GEMINI_API_KEY"
    timeout: 120
    models:
      default: "gemini-1.5-flash"
    default_params:
      temperature: 0.7
      max_tokens: 4000
    rate_limits:
      tier_1:
        requests: 60
        tokens: 1000000

  anthropic:
    enabled: false
    api_base_url: "https://api.anthropic.com"
    api_version: "2023-06-01"
    models:
      default: "claude-sonnet-4-20250514"
    default_params:
      temperature: 0.7
      max_tokens: 4000

  openai:
    enabled: false
    api_base_url: "https://api.openai.com/v1"
    api_version: "v1"
    models:
      default: "gpt-4-turbo-preview"
    default_params:
      temperature: 0.7
      max_tokens: 4000

  custom:
    enabled: false
    api_base_url: "http://localhost:8000"
    api_version: "v1"
    models:
      default: "local-model"
    default_params:
      temperature: 0.7
      max_tokens: 2000

# Agent-specific LLM assignments — use local Ollama
agent_models:
  reader:
    provider: "local"
    model: "qwen2.5:7b"
    params:
      temperature: 0.3
      max_tokens: 8000
      num_ctx: 20480         # INCREASE: Reader needs context
      num_batch: 512         # REDUCE from 512
      num_gpu: -1            # ADD: Force GPU offload
      num_parallel: 2        # ADD

  searcher:
    provider: "local"
    model: "qwen2.5:7b"
    params:
      temperature: 0.5
      max_tokens: 2000
      num_ctx: 8192          # Keep reasonable
      num_batch: 512         # REDUCE from 512
      num_gpu: -1            # ADD
      num_parallel: 2        # ADD

  writer:
    provider: "local"
    model: "qwen2.5:7b"
    params:
      temperature: 0.7
      max_tokens: 4000
      num_ctx: 12288         # INCREASE
      num_batch: 512         # REDUCE from 512
      num_gpu: -1            # ADD
      num_parallel: 2        # ADD

  verifier:
    provider: "local"
    model: "qwen2.5:7b"
    params:
      temperature: 0.2
      max_tokens: 4000
      num_ctx: 12288
      num_batch: 512         # REDUCE from 512
      num_gpu: -1            # ADD
      num_parallel: 2        # ADD

  evaluator:
    provider: "local"
    model: "qwen2.5:7b"
    params:
      temperature: 0.4
      max_tokens: 8000
      num_ctx: 20480         # INCREASE
      num_batch: 512         # REDUCE from 512
      num_gpu: -1            # ADD
      num_parallel: 2        # ADD