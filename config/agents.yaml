orchestrator:
  enabled: true
  max_iterations: 10
  parallel_execution: false

reader_agent:
  enabled: true
  priority: 1
  capabilities:
    - type_extraction
    - semantic_analysis
    - runtime_analysis
    - metadata_extraction
  parsers:
    - python
    - javascript
    - typescript
  analysis_depth: "deep"  # shallow, medium, deep

searcher_agent:
  enabled: true
  priority: 2
  knowledge_base:
    enabled: true
    path: "data/knowledge_base/"
    index_type: "whoosh"  # whoosh, faiss
  search_strategies:
    - semantic_search
    - keyword_search
    - pattern_matching
  max_results: 10

writer_agent:
  enabled: true
  priority: 3
  output_formats:
    - markdown
    - restructuredtext
    - docstring
    - html
  docstring_style: "google"  # google, numpy, sphinx
  include_examples: true
  include_type_hints: true
  versioning: true

verifier_agent:
  enabled: true
  priority: 4
  validation_rules:
    - completeness
    - accuracy
    - consistency
    - style_compliance
  trace_matching: true
  role_based_review:
    developer: true
    technical_writer: true
    end_user: false
  evaluation_criteria:
    - clarity
    - correctness
    - coverage
    - maintainability