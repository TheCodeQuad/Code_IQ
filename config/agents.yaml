orchestrator:
  enabled: true
  max_iterations: 10
  parallel_execution: true

reader_agent:
  enabled: true
  priority: 1
  max_retries: 3
  retry_delay: 1
  timeout: 120
  capabilities:
    - type_extraction
    - semantic_analysis
    - runtime_analysis
    - metadata_extraction
  parsers:
    - python
    - javascript
    - typescript
  analysis_depth: "deep"  # shallow, medium, deep

searcher_agent:
  enabled: true
  priority: 2
  max_retries: 2
  retry_delay: 1
  timeout: 60
  max_results: 10
  knowledge_base:
    enabled: true
    path: "data/knowledge_base/"
    index_type: "whoosh"  # whoosh, faiss
  search_strategies:
    - semantic_search
    - keyword_search
    - pattern_matching


writer_agent:
  enabled: true
  priority: 3
  max_retries: 3
  retry_delay: 2
  timeout: 180
  output_formats:
    - markdown
    - restructuredtext
    - docstring
    - html
  docstring_style: "google"  # google, numpy, sphinx
  include_examples: true
  include_type_hints: true
  versioning: true
  min_description_length: 50

verifier_agent:
  enabled: true
  priority: 4
  max_retries: 2
  max_rejections: 3  # Max writer-verifier refinement cycles
  retry_delay: 1
  timeout: 120
  validation_rules:
    - completeness
    - accuracy
    - consistency
    - style_compliance
  trace_matching: true
  role_based_review:
    developer: true
    technical_writer: true
    end_user: false
  evaluation_criteria:
    - clarity
    - correctness
    - coverage
    - maintainability